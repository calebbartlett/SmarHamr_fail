<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarHamr — Character‑Centric Mode</title>
<link rel="stylesheet" href="ui.css">
</head>

<body>

<div class="flex" style="height:100vh;">

    <!-- LEFT PANEL: Character Selection + Import/Reset -->
    <div class="panel" style="width:320px; margin:0; border-radius:0; overflow-y:auto;">
        <h2>Character‑Centric Mode</h2>
        <p>Root threads in character assets.</p>

        <h3 class="mt-10">Data Source</h3>
        <p id="dataSourceLabel"><em>Loading scratch Dexie…</em></p>

        <input type="file" id="dexieFile" accept=".json" />

        <button class="button mt-10" onclick="loadDexieExport()">
            Load Export (JSON)
        </button>

        <button class="button mt-10" onclick="loadScratchDexie()">
            Reset to Scratch
        </button>

        <h3 class="mt-20">Characters</h3>
        <div id="characterList">
            <p><em>No characters loaded yet.</em></p>
        </div>

        <button class="button mt-20" onclick="createNewCharacter()">
            Create New Character (scratch-only placeholder)
        </button>
    </div>

    <!-- RIGHT PANEL: Thread Builder -->
    <div class="flex column scroll" style="flex:1; padding:20px;">

        <div class="panel">
            <h3>Thread Root Character</h3>
            <p id="rootAssetInfo"><em>No character selected.</em></p>
        </div>

        <div class="panel">
            <h3>Thread Lore</h3>
            <textarea id="threadLore" placeholder="Thread-specific lore goes here..."></textarea>
        </div>

        <div class="panel">
            <h3>Thread Memory</h3>
            <textarea id="threadMemory" placeholder="Thread-specific memory goes here..."></textarea>
        </div>

        <div class="panel">
            <h3>Thread Messages</h3>
            <textarea id="threadMessages" placeholder="Message history will appear here..."></textarea>
        </div>

        <button class="button mt-20" onclick="saveThread()">
            Save Thread (placeholder)
        </button>

    </div>

</div>

<script>
let dexieData = null;
let currentCharacter = null;

window.addEventListener('load', () => {
    loadScratchDexie();
});

async function loadScratchDexie() {
    try {
        const res = await fetch('dexie-scratch.json');
        dexieData = await res.json();
        document.getElementById('dataSourceLabel').textContent = 'Scratch Dexie loaded';
        renderCharacters();
    } catch (e) {
        document.getElementById('dataSourceLabel').textContent = 'Failed to load scratch Dexie';
        console.error(e);
    }
}

function loadDexieExport() {
    const input = document.getElementById('dexieFile');
    if (!input.files || !input.files[0]) {
        alert('Select a JSON export file first.');
        return;
    }
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = e => {
        try {
            dexieData = JSON.parse(e.target.result);
            document.getElementById('dataSourceLabel').textContent = 'Export loaded: ' + file.name;
            renderCharacters();
        } catch (err) {
            alert('Invalid JSON export.');
            console.error(err);
        }
    };
    reader.readAsText(file);
}

function getTableRows(tableName) {
    if (!dexieData || !dexieData.data || !dexieData.data.data) return [];
    const table = dexieData.data.data.find(t => t.tableName === tableName);
    return table ? table.rows || [] : [];
}

function renderCharacters() {
    const list = document.getElementById('characterList');
    const rows = getTableRows('characters');
    if (!rows.length) {
        list.innerHTML = '<p><em>No characters in Dexie.</em></p>';
        return;
    }
    list.innerHTML = '';
    rows.forEach((row, idx) => {
        const btn = document.createElement('button');
        btn.className = 'button button-small mb-10';
        btn.textContent = row.name || `Character #${idx + 1}`;
        btn.onclick = () => selectCharacter(row);
        list.appendChild(btn);
    });
}

function selectCharacter(row) {
    currentCharacter = row;
    document.getElementById('rootAssetInfo').textContent =
        `Character: ${row.name || 'Unnamed'} (model: ${row.modelName || 'unknown'})`;
}

function createNewCharacter() {
    alert('TODO: Implement character creation and insertion into Dexie.');
}

function saveThread() {
    alert('TODO: Implement thread creation and saving into Dexie.');
}
</script>

</body>
</html>
