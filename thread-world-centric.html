<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarHamr — World‑Centric Mode</title>
<link rel="stylesheet" href="ui.css">
</head>

<body>

<div class="flex" style="height:100vh;">

    <!-- LEFT PANEL: World Selection + Import/Reset -->
    <div class="panel" style="width:320px; margin:0; border-radius:0; overflow-y:auto;">
        <h2>World‑Centric Mode</h2>
        <p>Root threads in world assets.</p>

        <h3 class="mt-10">Data Source</h3>
        <p id="dataSourceLabel"><em>Loading scratch Dexie…</em></p>

        <input type="file" id="dexieFile" accept=".json" />

        <button class="button mt-10" onclick="loadDexieExport()">
            Load Export (JSON)
        </button>

        <button class="button mt-10" onclick="loadScratchDexie()">
            Reset to Scratch
        </button>

        <h3 class="mt-20">Worlds</h3>
        <div id="worldList">
            <p><em>No worlds loaded yet.</em></p>
        </div>

        <button class="button mt-20" onclick="createNewWorld()">
            Create New World (placeholder)
        </button>
    </div>

    <!-- RIGHT PANEL: Thread Builder -->
    <div class="flex column scroll" style="flex:1; padding:20px;">

        <div class="panel">
            <h3>Thread Root World</h3>
            <p id="rootWorldInfo"><em>No world selected.</em></p>
        </div>

        <div class="panel">
            <h3>Global World Lore</h3>
            <textarea id="worldLore" placeholder="World asset lore goes here..."></textarea>
        </div>

        <div class="panel">
            <h3>Thread‑Specific Lore</h3>
            <textarea id="threadLore" placeholder="Thread-specific lore goes here..."></textarea>
        </div>

        <div class="panel">
            <h3>Thread Memory</h3>
            <textarea id="threadMemory" placeholder="Thread-specific memory goes here..."></textarea>
        </div>

        <div class="panel">
            <h3>Thread Messages</h3>
            <textarea id="threadMessages" placeholder="Message history will appear here..."></textarea>
        </div>

        <button class="button mt-20" onclick="saveThread()">
            Save Thread (placeholder)
        </button>

    </div>

</div>

<script>
let dexieData = null;
let currentWorld = null;

window.addEventListener('load', () => {
    loadScratchDexie();
});

async function loadScratchDexie() {
    try {
        const res = await fetch('dexie-scratch.json');
        dexieData = await res.json();
        document.getElementById('dataSourceLabel').textContent = 'Scratch Dexie loaded';
        renderWorlds();
    } catch (e) {
        document.getElementById('dataSourceLabel').textContent = 'Failed to load scratch Dexie';
        console.error(e);
    }
}

function loadDexieExport() {
    const input = document.getElementById('dexieFile');
    if (!input.files || !input.files[0]) {
        alert('Select a JSON export file first.');
        return;
    }
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = e => {
        try {
            dexieData = JSON.parse(e.target.result);
            document.getElementById('dataSourceLabel').textContent = 'Export loaded: ' + file.name;
            renderWorlds();
        } catch (err) {
            alert('Invalid JSON export.');
            console.error(err);
        }
    };
    reader.readAsText(file);
}

function getTableRows(tableName) {
    if (!dexieData || !dexieData.data || !dexieData.data.data) return [];
    const table = dexieData.data.data.find(t => t.tableName === tableName);
    return table ? table.rows || [] : [];
}

// For now, we treat "worlds" as a conceptual subset of characters or a future table.
// You can later map this to a dedicated worlds table if Perchance adds one.
function renderWorlds() {
    const list = document.getElementById('worldList');
    const rows = getTableRows('characters'); // placeholder: worlds-as-characters
    if (!rows.length) {
        list.innerHTML = '<p><em>No world-like assets in Dexie.</em></p>';
        return;
    }
    list.innerHTML = '';
    rows.forEach((row, idx) => {
        const btn = document.createElement('button');
        btn.className = 'button button-small mb-10';
        btn.textContent = row.name || `World #${idx + 1}`;
        btn.onclick = () => selectWorld(row);
        list.appendChild(btn);
    });
}

function selectWorld(row) {
    currentWorld = row;
    document.getElementById('rootWorldInfo').textContent =
        `World: ${row.name || 'Unnamed'} (model: ${row.modelName || 'unknown'})`;
}

function createNewWorld() {
    alert('TODO: Implement world asset creation and insertion into Dexie.');
}

function saveThread() {
    alert('TODO: Implement world-rooted thread creation and saving into Dexie.');
}
</script>

</body>
</html>
