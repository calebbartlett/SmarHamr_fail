<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarHamr — World‑Centric Mode</title>
<link rel="stylesheet" href="ui.css">
</head>

<body>

<!-- ============================================================
     Unified Import / Export Toolbar
============================================================ -->
<div class="panel" style="margin:0; border-radius:0;">
    <h2>SmarHamr — World‑Centric Mode</h2>

    <div class="row mb-10">
        <input type="file" id="dexieFile" accept=".json,.json.gz,.gz" style="flex:1;">

        <button class="button ml-10" onclick="importDexie()">Load Export</button>
        <button class="button ml-10" onclick="resetScratch()">Reset Scratch</button>
        <button class="button ml-10" onclick="exportDexie()">Export</button>
    </div>

    <p id="dataSourceLabel"><em>Loading scratch Dexie…</em></p>
</div>

<div class="flex" style="height:calc(100vh - 160px);">

    <!-- LEFT PANEL -->
    <div class="panel" style="width:320px; margin:0; border-radius:0; overflow-y:auto;">
        <h3>Worlds</h3>
        <div id="worldList">
            <p><em>No worlds loaded yet.</em></p>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="flex column scroll" style="flex:1; padding:20px;">

        <div class="panel">
            <h3>Thread Root World</h3>
            <p id="rootWorldInfo"><em>No world selected.</em></p>
        </div>

        <div class="panel">
            <h3>Global World Lore</h3>
            <textarea id="worldLore"></textarea>
        </div>

        <div class="panel">
            <h3>Thread‑Specific Lore</h3>
            <textarea id="threadLore"></textarea>
        </div>

        <div class="panel">
            <h3>Thread Memory</h3>
            <textarea id="threadMemory"></textarea>
        </div>

        <div class="panel">
            <h3>Thread Messages</h3>
            <textarea id="threadMessages"></textarea>
        </div>

        <button class="button mt-20" onclick="saveThread()">Save Thread</button>

    </div>

</div>

<script src="smarhamr-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

<script>
let dexieData = null;
let currentWorld = null;

window.addEventListener("load", async () => {
    dexieData = await smarhamrLoadScratch();
    document.getElementById("dataSourceLabel").textContent = "Scratch Dexie loaded";
    renderWorlds();
});

function resetScratch() {
    smarhamrLoadScratch().then(data => {
        dexieData = data;
        document.getElementById("dataSourceLabel").textContent = "Scratch Dexie loaded";
        renderWorlds();
    });
}

function importDexie() {
    const file = document.getElementById("dexieFile").files[0];
    if (!file) return alert("Choose a .json or .json.gz file first.");

    smarhamrLoadExport(file, data => {
        dexieData = data;
        document.getElementById("dataSourceLabel").textContent = `Loaded: ${file.name}`;
        renderWorlds();
    });
}

function exportDexie() {
    const prefix = prompt("Export filename prefix:", "worldMode");
    smarhamrExport(prefix, dexieData);
}

function renderWorlds() {
    const list = document.getElementById("worldList");
    const rows = smarhamrGetRows(dexieData, "characters"); // worlds-as-characters placeholder

    if (!rows.length) {
        list.innerHTML = "<p><em>No worlds found.</em></p>";
        return;
    }

    list.innerHTML = "";
    rows.forEach(row => {
        const btn = document.createElement("button");
        btn.className = "button button-small mb-10";
        btn.textContent = row.name || "Unnamed World";
        btn.onclick = () => selectWorld(row);
        list.appendChild(btn);
    });
}

function selectWorld(row) {
    currentWorld = row;
    document.getElementById("rootWorldInfo").textContent =
        `World: ${row.name || "Unnamed"} (model: ${row.modelName})`;
}

function saveThread() {
    alert("TODO: Implement world-thread saving.");
}
</script>

</body>
</html>
