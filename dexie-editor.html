<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarHamr — Dexie Editor</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>

<div id="topbar">
    <div id="currentFileName">Scratch Dexie</div>

    <div id="modeButtons">
        <button class="modeBtn" id="ccModeBtn" onclick="goCC()">Character‑Centric</button>
        <button class="modeBtn" id="wcModeBtn" onclick="goWC()">World‑Centric</button>
        <button class="modeBtn active" id="deModeBtn" onclick="goDexie()">Dexie Editor</button>
    </div>

    <div id="branding">SmarHamr by yggdrasil75</div>
</div>

<div class="app-root">
    <div class="left-nav" id="leftNav">

        <div class="panel">
            <h3>File Management</h3>
            <input type="file" id="dexieFile" accept=".json,.json.gz,.gz">
            <button onclick="importDexie()">Load Export</button>
            <button onclick="resetScratch()">Reset Scratch</button>
            <button onclick="exportDexie()">Export</button>
        </div>

        <div class="panel">
            <h3>Tables</h3>
            <div id="tableList">
                <p><em>No tables loaded.</em></p>
            </div>
        </div>

    </div>

    <div class="workspace">

        <div class="panel">
            <h3 id="selectedTableName"><em>No table selected.</em></h3>
        </div>

        <div class="panel">
            <h3>Rows</h3>
            <div id="rowList">
                <p><em>No rows.</em></p>
            </div>
        </div>

        <div class="panel">
            <h3>Row JSON</h3>
            <textarea id="rowJson"></textarea>
            <button onclick="applyRowEdit()">Apply Row Edit</button>
        </div>

    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="smarhamr-config.js"></script>
<script>
let currentTable = null;
let currentRows = [];
let currentRowIndex = null;

window.addEventListener("load", async () => {
    const hasState = smarhamrLoadState();
    if (!hasState && SmarHamrConfig.autoLoadScratchOnStartup) {
        await smarhamrLoadScratch();
    } else {
        updateCurrentFileNameUI();
    }
    renderTables();
});

function goCC() { window.location.href = "cc-mode.html"; }
function goWC() { window.location.href = "wc-mode.html"; }
function goDexie() { window.location.href = "dexie-editor.html"; }

function importDexie() {
    const file = document.getElementById("dexieFile").files[0];
    if (!file) { alert("Choose a file first."); return; }

    smarhamrLoadExport(file, data => {
        renderTables();
    });
}

function resetScratch() {
    smarhamrLoadScratch().then(() => {
        renderTables();
    });
}

function exportDexie() {
    const prefix = prompt("Export filename prefix:", "dexieEditor");
    smarhamrExport(prefix, dexieData);
}

function renderTables() {
    const list = document.getElementById("tableList");
    if (!dexieData) {
        list.innerHTML = "<p><em>No tables loaded.</em></p>";
        return;
    }

    const tables = dexieData.data.data || [];
    if (!tables.length) {
        list.innerHTML = "<p><em>No tables found.</em></p>";
        return;
    }

    list.innerHTML = "";
    tables.forEach(t => {
        const btn = document.createElement("button");
        btn.textContent = `${t.tableName} (${(t.rows || []).length} rows)`;
        btn.onclick = () => selectTable(t.tableName);
        list.appendChild(btn);
    });
}

function selectTable(name) {
    currentTable = name;
    currentRows = smarhamrGetRows(dexieData, name);
    currentRowIndex = null;

    document.getElementById("selectedTableName").textContent =
        `Table: ${name} (${currentRows.length} rows)`;

    renderRows();
    document.getElementById("rowJson").value = "";
}

function renderRows() {
    const container = document.getElementById("rowList");

    if (!currentRows.length) {
        container.innerHTML = "<p><em>No rows in this table.</em></p>";
        return;
    }

    container.innerHTML = "";
    currentRows.forEach((row, idx) => {
        const btn = document.createElement("button");
        btn.textContent = `Row #${idx}`;
        btn.onclick = () => selectRow(idx);
        container.appendChild(btn);
    });
}

function selectRow(index) {
    currentRowIndex = index;
    document.getElementById("rowJson").value =
        JSON.stringify(currentRows[index], null, 2);
}

function applyRowEdit() {
    if (currentRowIndex === null) {
        alert("Select a row first.");
        return;
    }

    try {
        const updated = JSON.parse(document.getElementById("rowJson").value);
        currentRows[currentRowIndex] = updated;
        smarhamrSetRows(dexieData, currentTable, currentRows);
        smarhamrSaveState(dexieData, currentFileName);
        alert("Row updated.");
    } catch (err) {
        alert("Invalid JSON.");
    }
}
</script>
</body>
</html>
