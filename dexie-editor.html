<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarHamr — Dexie Editor (Guru Mode)</title>
<link rel="stylesheet" href="ui.css">
</head>

<body>

<div class="flex" style="height:100vh;">

    <!-- LEFT PANEL -->
    <div class="panel" style="width:320px; margin:0; border-radius:0; overflow-y:auto;">
        <h2>Dexie Editor</h2>
        <p>Inspect and edit the raw Dexie structure.</p>

        <h3 class="mt-10">Data Source</h3>
        <p id="dataSourceLabel"><em>Loading scratch Dexie…</em></p>

        <input type="file" id="dexieFile" accept=".json" />

        <button class="button mt-10" onclick="importDexie()">
            Load Export (JSON)
        </button>

        <button class="button mt-10" onclick="resetScratch()">
            Reset to Scratch
        </button>

        <button class="button mt-10" onclick="exportDexie()">
            Export Dexie (gzip)
        </button>

        <h3 class="mt-20">Tables</h3>
        <div id="tableList">
            <p><em>No tables loaded.</em></p>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="flex column scroll" style="flex:1; padding:20px;">

        <div class="panel">
            <h3>Selected Table</h3>
            <p id="selectedTableName"><em>No table selected.</em></p>
        </div>

        <div class="panel">
            <h3>Rows</h3>
            <div id="rowList">
                <p><em>No rows to display.</em></p>
            </div>
        </div>

        <div class="panel">
            <h3>Row JSON</h3>
            <textarea id="rowJson" class="code-block" style="min-height:200px;"></textarea>

            <button class="button mt-10" onclick="applyRowEdit()">
                Apply Row Edit
            </button>
        </div>

    </div>

</div>

<script src="smarhamr-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

<script>
let dexieData = null;
let currentTable = null;
let currentRows = [];
let currentRowIndex = null;

window.addEventListener("load", async () => {
    dexieData = await smarhamrLoadScratch();
    document.getElementById("dataSourceLabel").textContent = "Scratch Dexie loaded";
    renderTables();
});

function resetScratch() {
    smarhamrLoadScratch().then(data => {
        dexieData = data;
        document.getElementById("dataSourceLabel").textContent = "Scratch Dexie loaded";
        renderTables();
    });
}

function importDexie() {
    const file = document.getElementById("dexieFile").files[0];
    if (!file) return alert("Choose a JSON file first.");

    smarhamrLoadExport(file, data => {
        dexieData = data;
        document.getElementById("dataSourceLabel").textContent = "Export loaded";
        renderTables();
    });
}

function exportDexie() {
    const prefix = prompt("Export filename prefix:", "dexieEditor");
    smarhamrExport(prefix, dexieData);
}

function renderTables() {
    const list = document.getElementById("tableList");
    const tables = dexieData.data.tables;

    if (!tables.length) {
        list.innerHTML = "<p><em>No tables found.</em></p>";
        return;
    }

    list.innerHTML = "";
    tables.forEach(t => {
        const btn = document.createElement("button");
        btn.className = "button button-small mb-10";
        btn.textContent = `${t.name} (${t.rowCount} rows)`;
        btn.onclick = () => selectTable(t.name);
        list.appendChild(btn);
    });
}

function selectTable(name) {
    currentTable = name;
    currentRows = smarhamrGetRows(dexieData, name);
    currentRowIndex = null;

    document.getElementById("selectedTableName").textContent =
        `Table: ${name} (${currentRows.length} rows)`;

    renderRows();
    document.getElementById("rowJson").value = "";
}

function renderRows() {
    const container = document.getElementById("rowList");

    if (!currentRows.length) {
        container.innerHTML = "<p><em>No rows in this table.</em></p>";
        return;
    }

    container.innerHTML = "";
    currentRows.forEach((row, idx) => {
        const btn = document.createElement("button");
        btn.className = "button button-small mb-10";
        btn.textContent = `Row #${idx}`;
        btn.onclick = () => selectRow(idx);
        container.appendChild(btn);
    });
}

function selectRow(index) {
    currentRowIndex = index;
    document.getElementById("rowJson").value =
        JSON.stringify(currentRows[index], null, 2);
}

function applyRowEdit() {
    if (currentRowIndex === null) return alert("Select a row first.");

    try {
        const updated = JSON.parse(document.getElementById("rowJson").value);
        currentRows[currentRowIndex] = updated;
        smarhamrSetRows(dexieData, currentTable, currentRows);
        alert("Row updated.");
    } catch (err) {
        alert("Invalid JSON.");
    }
}
</script>

</body>
</html>
