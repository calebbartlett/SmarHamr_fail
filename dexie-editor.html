<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmarHamr — Dexie Editor</title>
    <link rel="stylesheet" href="ui.css">
</head>

<body>

<div id="topbar">
    <div id="currentFileName">Scratch Dexie</div>

    <div id="modeButtons">
        <button class="modeBtn" id="ccModeBtn" onclick="goCC()">CC Mode</button>
        <button class="modeBtn" id="wcModeBtn" onclick="goWC()">WC Mode</button>
        <button class="modeBtn" id="deModeBtn" onclick="goDexie()">Dexie Editor</button>
    </div>

    <div id="branding">SmarHamr Cockpit</div>
</div>

<div class="app-root">

    <div class="left-nav">
        <input type="file" id="dexieFile">
        <button onclick="smarhamrLoadExportFile('dexieFile')">Load Export</button>
        <button onclick="smarhamrResetScratch()">Reset Scratch</button>
        <button onclick="smarhamrSaveToMemory()">Save</button>
        <button onclick="smarhamrExportDexie()">Export</button>

        <h3>Tables</h3>
        <div id="tableList" class="asset-list"></div>
    </div>

    <div class="workspace">

        <div class="panel">
            <h3>Rows</h3>
            <div id="rowList" class="asset-list"></div>
        </div>

        <div class="panel">
            <h3>Row JSON</h3>
            <textarea id="rowJson"></textarea>
            <button onclick="smarhamrApplyRowEdit()">Apply Row Edit</button>
            <button onclick="smarhamrExportModifiedDexie()">Export Modified Dexie</button>
        </div>

    </div>
</div>

<div id="clipboardTab">Clipboard</div>

<div id="clipboardPanel">
    <button id="clipboardToggle">&gt; Show</button>
    <textarea id="clipboardText"></textarea>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="pako.min.js"></script>
<script src="smarhamr-config.js"></script>
<script src="smarhamr-core.js"></script>
<script src="smarhamr-file.js"></script>
<script src="smarhamr-clipboard.js"></script>
<script src="smarhamr-ui.js"></script>
<script src="smarhamr-dexie.js"></script>

<script>
    window.addEventListener("load", smarhamrInitDexie);
</script>

</body>
</html>
