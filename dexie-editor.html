<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarHamr — Dexie Editor</title>
<link rel="stylesheet" href="ui.css">

<style>
/* Workspace + clipboard layout */
.app-root {
    display: flex;
    height: calc(100vh - 40px);
}

/* center workspace + right clipboard */
.workspace-shell {
    display: flex;
    flex: 1;
    overflow: hidden;
}

/* main stacked workspace */
.workspace {
    flex: 1;
    padding: 10px;
    box-sizing: border-box;
    overflow-y: auto;
}

/* clipboard vertical tab + panel */
.clipboard-tab {
    position: relative;
    width: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #181818;
    border-left: 1px solid #333;
    cursor: pointer;
}

.clipboard-tab span {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 0.75rem;
    color: #ccc;
}

.clipboard {
    width: 300px;
    min-width: 200px;
    max-width: 600px;
    resize: horizontal;
    overflow: auto;
    background: #181818;
    border-left: 1px solid #333;
    padding: 10px;
    box-sizing: border-box;
    display: none;
}

.clipboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}

.clipboard-header button {
    font-size: 0.75rem;
}

/* table list */
#tableList button {
    width: 100%;
    text-align: left;
    margin-bottom: 4px;
}

#tableList button.active {
    background: #4a7;
    color: #111;
    border-color: #6c9;
}

/* row list */
#rowList button {
    width: 100%;
    text-align: left;
    margin-bottom: 4px;
}

#rowList button.active {
    background: #6a9;
    color: #111;
    border-color: #9cb;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div id="topbar">
    <div id="currentFileName">Scratch Dexie</div>

    <div id="modeButtons">
        <button class="modeBtn" id="ccModeBtn" onclick="goCC()">Character‑Centric</button>
        <button class="modeBtn" id="wcModeBtn" onclick="goWC()">World‑Centric</button>
        <button class="modeBtn active" id="deModeBtn" onclick="goDexie()">Dexie Editor</button>
    </div>

    <div id="branding">SmarHamr by yggdrasil75</div>
</div>

<div class="app-root">

    <!-- LEFT NAV -->
    <div class="left-nav" id="leftNav">

        <div class="panel">
            <h3>File Management</h3>

            <input type="file" id="dexieFile" accept=".json,.json.gz,.gz">

            <button onclick="loadExport()">Load Export</button>
            <button onclick="resetScratch()">Reset Scratch</button>

            <!-- NEW: Save to Memory -->
            <button onclick="saveToMemory()">Save to Memory</button>

            <!-- Existing: Export -->
            <button onclick="exportDexie()">Export</button>
        </div>

        <div class="panel">
            <h3>Dexie Tables</h3>
            <div id="tableList">
                <p><em>No Dexie database loaded.</em></p>
            </div>
        </div>

    </div>

    <!-- CENTER WORKSPACE + RIGHT CLIPBOARD -->
    <div class="workspace-shell">

        <!-- MAIN WORKSPACE -->
        <div class="workspace">

            <!-- Selected Table -->
            <div class="panel">
                <h3>Selected Table</h3>
                <p id="selectedTableName"><em>No table selected.</em></p>
            </div>

            <!-- Rows -->
            <div class="panel">
                <h3>Rows</h3>
                <div id="rowList">
                    <p><em>No rows to display.</em></p>
                </div>
            </div>

            <!-- Row JSON -->
            <div class="panel">
                <h3>Row JSON</h3>
                <textarea id="rowJson" class="code-block" style="min-height:200px;"
                    placeholder="Select a row to view/edit JSON..."></textarea>

                <button onclick="applyRowEdit()">Apply Row Edit</button>
            </div>

            <button class="button mt-20" onclick="exportDexie()">
                Export Modified Dexie JSON
            </button>

        </div>

        <!-- RIGHT-HAND CLIPBOARD -->
        <div class="clipboard-tab" id="clipboardTab">
            <span>Clipboard</span>
        </div>

        <div class="clipboard" id="clipboardPanel">
            <div class="clipboard-header">
                <span>Clipboard</span>
                <button id="clipboardToggle">&lt; Hide</button>
            </div>
            <textarea id="clipboardText"></textarea>
        </div>

    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="smarhamr-config.js"></script>

<script>
/* ============================================================
   GLOBAL STATE — shared across all modes
   ============================================================ */
dexieData = window.dexieData || null;
currentFileName = window.currentFileName || "Scratch Dexie";
let selectedAssetId = null;


/* ============================================================
   STARTUP — no auto-load from memory
   ============================================================ */
window.addEventListener("load", () => {
    updateCurrentFileNameUI();
    renderAssets();
    loadClipboard();
});

/* ============================================================
   NAVIGATION — preserve in-RAM dexieData across modes
   ============================================================ */
function goCC() { window.location.href = "cc-mode.html"; }
function goWC() { window.location.href = "wc-mode.html"; }
function goDexie() { window.location.href = "dexie-editor.html"; }

/* ============================================================
   FILE MANAGEMENT — Load, Reset, Save to Memory, Export
   ============================================================ */
function loadExport() {
    const file = document.getElementById("dexieFile").files[0];
    if (!file) { alert("Choose a file first."); return; }

    smarhamrLoadExport(file, data => {
        dexieData = data;
        currentFileName = file.name;
        updateCurrentFileNameUI();
        renderAssets();
    });
}

function resetScratch() {
    smarhamrLoadScratch().then(() => {
        currentFileName = "Scratch Dexie";
        updateCurrentFileNameUI();
        renderAssets();
    });
}

function saveToMemory() {
    if (!dexieData) {
        alert("No Dexie data loaded.");
        return;
    }
    smarhamrSaveState(dexieData, currentFileName);
    alert("Saved to memory.");
}

function exportDexie() {
    if (!dexieData) {
        alert("No Dexie data loaded.");
        return;
    }
    const prefix = prompt("Export filename prefix:", "assets");
    smarhamrExport(prefix, dexieData);
}

/* ============================================================
   ASSET LIST
   ============================================================ */
function renderAssets() {
    const list = document.getElementById("assetList");

    if (!dexieData) {
        list.innerHTML = "<p><em>No assets loaded.</em></p>";
        return;
    }

    const rows = smarhamrGetRows(dexieData, "characters");
    if (!rows.length) {
        list.innerHTML = "<p><em>No assets found.</em></p>";
        return;
    }

    list.innerHTML = "";
    rows.forEach(row => {
        const btn = document.createElement("button");
        btn.textContent = row.name || `Asset #${row.id}`;
        btn.onclick = () => selectAsset(row);
        if (row.id === selectedAssetId) btn.classList.add("active");
        list.appendChild(btn);
    });
}

/* ============================================================
   SELECT ASSET + POPULATE PANELS
   ============================================================ */
function selectAsset(row) {
    selectedAssetId = row.id;
    highlightSelectedAsset();
    populateIdentity(row);
    populateBehavior(row);
    populatePrompting(row);
    populateVisual(row);
    populateInitialMessages(row);
    populateLore(row);
    populateCustomCode(row);
}

function highlightSelectedAsset() {
    const list = document.getElementById("assetList");
    Array.from(list.querySelectorAll("button")).forEach(btn => {
        btn.classList.remove("active");
        if (btn.textContent.includes(`#${selectedAssetId}`)) {
            btn.classList.add("active");
        }
    });
}

/* ============================================================
   IDENTITY PANEL
   ============================================================ */
function populateIdentity(row) {
    const el = document.getElementById("identityView");
    const identity = {
        id: row.id,
        name: row.name,
        modelName: row.modelName,
        uuid: row.uuid,
        creationTime: row.creationTime,
        lastMessageTime: row.lastMessageTime,
        folderPath: row.folderPath
    };
    el.textContent = JSON.stringify(identity, null, 2);
}

/* ============================================================
   WORLD BEHAVIOR PANEL
   ============================================================ */
function populateBehavior(row) {
    document.getElementById("roleInstruction").value = row.roleInstruction || "";
    document.getElementById("generalWritingInstructions").value = row.generalWritingInstructions || "";
    document.getElementById("reminderMessage").value = row.reminderMessage || "";
    document.getElementById("messageWrapperStyle").value = row.messageWrapperStyle || "";
    document.getElementById("fitMessagesInContextMethod").value = row.fitMessagesInContextMethod || "";
    document.getElementById("autoGenerateMemories").value = row.autoGenerateMemories || "";
    document.getElementById("temperature").value = row.temperature ?? "";
    document.getElementById("maxTokensPerMessage").value = row.maxTokensPerMessage ?? "";
    document.getElementById("textEmbeddingModelName").value = row.textEmbeddingModelName || "";
}

function saveBehavior() {
    if (!dexieData || selectedAssetId == null) return;

    const rows = smarhamrGetRows(dexieData, "characters");
    const row = rows.find(r => r.id === selectedAssetId);

    row.roleInstruction = document.getElementById("roleInstruction").value;
    row.generalWritingInstructions = document.getElementById("generalWritingInstructions").value;
    row.reminderMessage = document.getElementById("reminderMessage").value;
    row.messageWrapperStyle = document.getElementById("messageWrapperStyle").value;
    row.fitMessagesInContextMethod = document.getElementById("fitMessagesInContextMethod").value;
    row.autoGenerateMemories = document.getElementById("autoGenerateMemories").value;
    row.temperature = parseFloat(document.getElementById("temperature").value) || row.temperature;
    row.maxTokensPerMessage = parseInt(document.getElementById("maxTokensPerMessage").value) || row.maxTokensPerMessage;
    row.textEmbeddingModelName = document.getElementById("textEmbeddingModelName").value;

    smarhamrSetRows(dexieData, "characters", rows);
    alert("World behavior saved.");
}

/* ============================================================
   PROMPTING PANEL
   ============================================================ */
function populatePrompting(row) {
    document.getElementById("imagePromptPrefix").value = row.imagePromptPrefix || "";
    document.getElementById("imagePromptSuffix").value = row.imagePromptSuffix || "";
    document.getElementById("imagePromptTriggers").value = row.imagePromptTriggers || "";
    document.getElementById("messageInputPlaceholder").value = row.messageInputPlaceholder || "";
}

function savePrompting() {
    if (!dexieData || selectedAssetId == null) return;

    const rows = smarhamrGetRows(dexieData, "characters");
    const row = rows.find(r => r.id === selectedAssetId);

    row.imagePromptPrefix = document.getElementById("imagePromptPrefix").value;
    row.imagePromptSuffix = document.getElementById("imagePromptSuffix").value;
    row.imagePromptTriggers = document.getElementById("imagePromptTriggers").value;
    row.messageInputPlaceholder = document.getElementById("messageInputPlaceholder").value;

    smarhamrSetRows(dexieData, "characters", rows);
    alert("Prompting saved.");
}

/* ============================================================
   VISUAL PANEL
   ============================================================ */
function populateVisual(row) {
    document.getElementById("avatar").value =
        row.avatar ? JSON.stringify(row.avatar, null, 2) : "";

    document.getElementById("scene").value =
        row.scene ? JSON.stringify(row.scene, null, 2) : "";

    document.getElementById("userCharacter").value =
        row.userCharacter ? JSON.stringify(row.userCharacter, null, 2) : "";

    document.getElementById("systemCharacter").value =
        row.systemCharacter ? JSON.stringify(row.systemCharacter, null, 2) : "";
}

function saveVisual() {
    if (!dexieData || selectedAssetId == null) return;

    const rows = smarhamrGetRows(dexieData, "characters");
    const row = rows.find(r => r.id === selectedAssetId);

    try { row.avatar = JSON.parse(document.getElementById("avatar").value || "null"); } catch {}
    try { row.scene = JSON.parse(document.getElementById("scene").value || "null"); } catch {}
    try { row.userCharacter = JSON.parse(document.getElementById("userCharacter").value || "null"); } catch {}
    try { row.systemCharacter = JSON.parse(document.getElementById("systemCharacter").value || "null"); } catch {}

    smarhamrSetRows(dexieData, "characters", rows);
    alert("Visual identity saved.");
}

/* ============================================================
   INITIAL MESSAGES PANEL
   ============================================================ */
function populateInitialMessages(row) {
    document.getElementById("initialMessages").value =
        row.initialMessages ? JSON.stringify(row.initialMessages, null, 2) : "";
}

function saveInitialMessages() {
    if (!dexieData || selectedAssetId == null) return;

    const rows = smarhamrGetRows(dexieData, "characters");
    const row = rows.find(r => r.id === selectedAssetId);

    try {
        row.initialMessages = JSON.parse(document.getElementById("initialMessages").value || "[]");
        smarhamrSetRows(dexieData, "characters", rows);
        alert("Initial messages saved.");
    } catch {
        alert("Invalid JSON for initial messages.");
    }
}

/* ============================================================
   LORE PANEL
   ============================================================ */
function populateLore(row) {
    document.getElementById("loreBookUrls").value =
        row.loreBookUrls ? JSON.stringify(row.loreBookUrls, null, 2) : "";
}

function saveLore() {
    if (!dexieData || selectedAssetId == null) return;

    const rows = smarhamrGetRows(dexieData, "characters");
    const row = rows.find(r => r.id === selectedAssetId);

    try {
        row.loreBookUrls = JSON.parse(document.getElementById("loreBookUrls").value || "[]");
        smarhamrSetRows(dexieData, "characters", rows);
        alert("Lore saved.");
    } catch {
        alert("Invalid JSON for loreBookUrls.");
    }
}

/* ============================================================
   CUSTOM CODE PANEL
   ============================================================ */
function populateCustomCode(row) {
    document.getElementById("customCode").value = row.customCode || "";
}

function saveCustomCode() {
    if (!dexieData || selectedAssetId == null) return;

    const rows = smarhamrGetRows(dexieData, "characters");
    const row = rows.find(r => r.id === selectedAssetId);

    row.customCode = document.getElementById("customCode").value;
    smarhamrSetRows(dexieData, "characters", rows);
    alert("Custom code saved.");
}

/* ============================================================
   THREAD BUILDER (scratchpad only)
   ============================================================ */
function populateThreadBuilder(row) {
    document.getElementById("threadLore").value = "";
    document.getElementById("threadMemory").value = "";
    document.getElementById("threadMessages").value = "";
}

/* ============================================================
   SHORTCUT SCROLL
   ============================================================ */
function scrollToPanel(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ============================================================
   CLIPBOARD PERSISTENCE
   ============================================================ */
function loadClipboard() {
    const text = localStorage.getItem("smarhamrClipboard") || "";
    document.getElementById("clipboardText").value = text;

    const open = localStorage.getItem("smarhamrClipboardOpen") === "true";
    setClipboardOpen(open);
}

function saveClipboard() {
    const text = document.getElementById("clipboardText").value;
    localStorage.setItem("smarhamrClipboard", text);
}

/* ============================================================
   CLIPBOARD OPEN/CLOSE
   ============================================================ */
function setClipboardOpen(open) {
    const panel = document.getElementById("clipboardPanel");
    const toggle = document.getElementById("clipboardToggle");

    if (open) {
        panel.style.display = "block";
        toggle.textContent = "< Hide";
    } else {
        panel.style.display = "none";
        toggle.textContent = "> Show";
    }

    localStorage.setItem("smarhamrClipboardOpen", open ? "true" : "false");
}

/* ============================================================
   CLIPBOARD EVENTS
   ============================================================ */
document.getElementById("clipboardTab").addEventListener("click", () => {
    const open = localStorage.getItem("smarhamrClipboardOpen") === "true";
    setClipboardOpen(!open);
});

document.getElementById("clipboardToggle").addEventListener("click", () => {
    const open = localStorage.getItem("smarhamrClipboardOpen") === "true";
    setClipboardOpen(!open);
});

document.getElementById("clipboardText").addEventListener("input", saveClipboard);

</script>

</body>
</html>
