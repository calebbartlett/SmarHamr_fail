<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmarHamr Studio</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        height: 100vh;
        overflow: hidden;
    }

    #container {
        display: flex;
        height: 100vh;
        width: 100vw;
    }

    /* LEFT SIDE — NAVIGATION */
    #nav {
        width: 300px;
        min-width: 260px;
        background: #222;
        color: #fff;
        padding: 24px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
    }

    #nav h2 {
        margin-top: 0;
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        text-align: left;
    }

    .nav-button {
        width: 100%;
        padding: 14px;
        margin-bottom: 14px;
        background: #444;
        border: none;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
        border-radius: 6px;
        text-align: left;
        transition: background 0.2s ease;
    }

    .nav-button:hover {
        background: #555;
    }

    /* RIGHT SIDE — FAQ PANEL */
    #faq {
        flex: 1;
        background: #fff;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 0;
        display: flex;
        flex-direction: column;
    }

    #faq iframe {
        flex: 1;
        width: 100%;
        border: none;
    }

    /* RESPONSIVE BEHAVIOR */
    @media (max-width: 800px) {
        #container {
            flex-direction: column;
        }

        #nav {
            width: 100%;
            min-width: 100%;
        }

        #faq {
            height: calc(100vh - 260px);
        }
    }
</style>
</head>

<body>

<div id="container">

    <!-- LEFT SIDE: MODE SELECTOR -->
    <div id="nav">
        <h2>SmarHamr Studio</h2>

        <button class="nav-button"
            onclick="location.href='thread-character-centric.html'">
            Character‑Centric Mode
        </button>

        <button class="nav-button"
            onclick="location.href='thread-world-centric.html'">
            World‑Centric Mode
        </button>

        <button class="nav-button"
            onclick="location.href='dexie-editor.html'">
            Dexie Editor (Guru Mode)
        </button>
    </div>

    <!-- RIGHT SIDE: FAQ PANEL (Embedded) -->
    <div id="faq">
        <iframe src="faq.html"></iframe>
    </div>

</div>

</body>
</html>
